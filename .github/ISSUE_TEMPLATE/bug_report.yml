name: Bug report
description: Report a bug or issue for a feature that's not working as expected
labels: [bug]
body:
  - type: input
    id: tool-version
    attributes:
      label: Tool version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: toolbox-version
    attributes:
      label: Power Platform ToolBox version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, what you expected, and the steps to reproduce it.
    validations:
      required: true
